# Publishes js/ to npm when a js-v* tag is pushed (js-v0.1.0). Authentication is npm trusted
# publishing (OIDC): no NPM_TOKEN secret. The trusted publisher is set on npmjs.com after the
# package exists; versions already on npm are skipped.
name: Publish to npm

on:
  push:
    tags: ["js-v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm >= 11.5.1 (required for trusted publishing)
        run: |
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || npm install -g npm@11
          npm --version
      - name: Check that the tag matches package.json
        run: test "js-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Skip versions that are already on npm
        id: published
        run: |
          version="${GITHUB_REF_NAME#js-v}"
          if [ "$(npm view "$(node -p 'require("./package.json").name')@$version" version 2>/dev/null)" = "$version" ]; then
            echo "Version $version is already on npm, nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --provenance
        if: steps.published.outputs.skip != 'true'
